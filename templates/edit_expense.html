{% extends "base.html" %}

{% block title %}Edit Transaction — WealthIQ{% endblock %}

{% block body_class %}auth-bg{% endblock %}

{% block no_sidebar_content %}

<div class="auth-container py-5">
    <div class="card auth-card shadow-lg border-0" style="background: var(--surface); max-width: 500px;">
        <div class="d-flex align-items-center mb-4">
            <a href="{{ url_for('dashboard') }}" class="btn btn-sm btn-light me-3" style="width: 32px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%;">
                <i class="fa-solid fa-arrow-left text-muted"></i>
            </a>
            <div>
                <h1 style="font-size: 1.25rem; font-weight: 700; margin: 0; letter-spacing: -0.01em;">Edit Transaction</h1>
            </div>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 px-3 text-center mb-4" style="font-size: 0.85rem; border-radius: var(--radius-sm); border: 1px solid var(--danger-subtle); background: var(--danger-subtle); color: var(--danger);">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('edit_expense', id=expense.id) }}">
            
            <div class="mb-4">
                <label for="amount" class="form-label">Amount (₹)</label>
                <div class="position-relative">
                    <span class="position-absolute top-50 translate-middle-y ms-3 text-muted fw-bold">₹</span>
                    <input type="number" step="0.01" min="0.01" id="amount" name="amount"
                           class="form-control form-control-lg ps-5" style="font-size: 1.25rem; font-weight: 600;" placeholder="0.00" value="{{ expense.amount }}" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <select id="category" name="category" class="form-select" required>
                    {% for cat in categories_list %}
                        <option value="{{ cat }}" {% if expense.category == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="date" class="form-label">Transaction Date</label>
                <input type="date" id="date" name="date" class="form-control" 
                       value="{{ expense.date }}" required>
            </div>

            <div class="mb-4">
                <label for="description" class="form-label">Description <span class="text-muted fw-normal">(Optional)</span></label>
                <input type="text" id="description" name="description"
                       class="form-control" placeholder="e.g. Weekly groceries" value="{{ expense.description or '' }}">
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary flex-grow-1 py-2">Save Changes</button>
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline-primary py-2 px-4">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
